services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waapi
      POSTGRES_PASSWORD: waapi
      POSTGRES_DB: waapi
    ports:
      - "5432:5432"
    volumes:
      - waapi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waapi -d waapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - waapi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local/dev still uses `pnpm dev:worker`. This service documents graceful stop
  # (stop_grace_period 30s) for compose-based deploys: `docker compose --profile worker up`.
  worker:
    profiles: ["worker"]
    image: node:20-bookworm-slim
    working_dir: /app
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://waapi:waapi@postgres:5432/waapi
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
    command: ["pnpm", "--filter", "@waapi/worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  waapi_pg:
  waapi_redis:
